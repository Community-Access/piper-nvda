name = piperNeural
summary = "Piper Neural Voices"
description = "Fast neural text-to-speech for NVDA using Piper voices. Runs fully offline in a bundled helper process. Browse, download, and hear demos of Piper voices in many languages directly from within NVDA. Correct how any word is pronounced, choose the voice for each language, and reuse voices from other Piper add-ons. Supports indexing, spelling, automatic language switching, multi-speaker voices, and fast rate boost."
author = "Jeff Bishop <jeff@jeffbishop.com>"
url = https://github.com/Community-Access/piper-nvda
version = 0.4.0
docFileName = readme.html
minimumNVDAVersion = 2025.1.0
lastTestedNVDAVersion = 2026.1.0
